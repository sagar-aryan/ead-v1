[package]
name = "ead-dashboard"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"                                          # verify the device configuration hash
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.30"                             # Wi-Fi link
serialport = { version = "4", default-features = false }  # USB link
rusqlite = { version = "0.40", features = ["bundled"] }   # session store
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
