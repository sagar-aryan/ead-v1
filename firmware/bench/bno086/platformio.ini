; Bench test for the BNO086s on the final DEC-016 wiring, one sensor per build
; — NOT part of the product firmware. Kept in its own project so the firmware
; in ../.. stays dependency-free (no external lib_deps in the product build).
;
;   pio run -d firmware/bench/bno086 -e foot -t upload
;   pio run -d firmware/bench/bno086 -e shank -t upload
;   python3 tools/bno_view.py
;
; Wiring: docs/wiring_reference.md (DEC-016). Until 2026-10-02 this project
; used the one-sensor bench pins (D0-D3), which are motor gates on DEC-016.

[platformio]
; Without -e, an upload would flash both envs one after the other.
default_envs = foot

[env]
platform = espressif32 @ 7.1.3
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=0
; A known-good third-party driver, on purpose: if the bench test fails we know
; it is the wiring, not new code of ours. The product driver is written after
; the wiring is proven.
lib_deps = sparkfun/SparkFun BNO08x Cortex Based IMU @ ^1.0.6

[env:foot]
build_flags = ${env.build_flags} -DEAD_BENCH_SENSOR_FOOT

[env:shank]
build_flags = ${env.build_flags} -DEAD_BENCH_SENSOR_SHANK
