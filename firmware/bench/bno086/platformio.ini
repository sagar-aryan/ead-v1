; Bench test for ONE BNO086 over SPI — NOT part of the product firmware.
; Kept in its own project so the firmware in ../.. stays dependency-free
; (docs/decisions.md DEC-001 style rule: no external lib_deps in the product build).
;
;   pio run -d firmware/bench/bno086 -t upload
;   pio device monitor -b 115200
;
; Wiring: docs/hardware.md "BNO086 bench test (one sensor)".

[env:seeed_xiao_esp32s3]
platform = espressif32 @ 7.1.3
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=0
; A known-good third-party driver, on purpose: if the bench test fails we know
; it is the wiring, not new code of ours. The product driver is written after
; the wiring is proven.
lib_deps = sparkfun/SparkFun BNO08x Cortex Based IMU @ ^1.0.6
