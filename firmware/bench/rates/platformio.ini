; Report-rate survey for both BNO086s, through the product's own driver
; (firmware/src/bno086.cpp, ead_core sh2) — NOT part of the product firmware.
; Each requested interval: what the hub chose, and every report counted, with
; sequence gaps, for both sensors read together as the product reads them.
;
;   pio run -d firmware/bench/rates -t upload
;   then read the port: any byte re-sends the transcript.

[env:seeed_xiao_esp32s3]
platform = espressif32 @ 7.1.3
board = seeed_xiao_esp32s3
framework = arduino
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=0 -I../../include -I../../src
build_src_filter = +<*> +<../../../src/bno086.cpp>
lib_extra_dirs = ../../lib
lib_deps = ead_core
