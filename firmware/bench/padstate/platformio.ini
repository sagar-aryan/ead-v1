; Reads back what the ROM and the bootloader leave on each pad before user code
; runs: pull-up, pull-down, input enable, drive strength, function select, plus
; the JTAG eFuses. Answers "is this pin safe to drive a motor gate at boot?"
; with a measurement instead of an assumption.
;
;   pio run -d firmware/bench/padstate -t upload
;   then send any byte on the USB port to have the report re-sent.
;
; Not product firmware.

[env:seeed_xiao_esp32s3]
platform = espressif32 @ 7.1.3
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=0
