; EAD-V1 firmware — Seeed XIAO ESP32-S3 (Arduino framework)
; Ref: ead_agent_docs_v2/00_README.md, 01_SYSTEM_SPEC.md, 07_FIRMWARE_ARCHITECTURE.md
; USB CDC flags (ARDUINO_USB_MODE / ARDUINO_USB_CDC_ON_BOOT) and PSRAM come
; from the seeed_xiao_esp32s3 board definition.

[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32 @ 7.1.3
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
; include/ is not on library include paths by default; lib/ead_core needs config_v1.h.
; CORE_DEBUG_LEVEL=0 compiles out Arduino core logging (log_e etc.). Unset, it
; defaults to errors, which print into the USB FIFO and corrupt protocol frames
; (docs/problems.md PROB-006).
build_flags = -std=gnu++17 -Iinclude -DCORE_DEBUG_LEVEL=0
build_src_flags = -Wall -Wextra
extra_scripts = pre:scripts/generate_headers.py
; Unit tests run on the host (env:native).
test_ignore = *

; Host build of lib/ead_core for Unity tests: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -Iinclude
  '-DEAD_VECTORS_DIR="${PROJECT_DIR}/../protocol/vectors"'
